info:
  name: Listar Investigadores
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/investigadores"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/investigadores"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "nombreCompleto": "Laura Correa",
              "grupoInvestigacion": "Test"
            }
          ]
