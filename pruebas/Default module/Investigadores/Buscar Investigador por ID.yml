info:
  name: Buscar Investigador por ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/investigadores/:id"
  params:
    - name: id
      value: "4"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/investigadores/:id"
      method: GET
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "nombreCompleto": "",
            "grupoInvestigacion": ""
          }
