info:
  name: Listar Por Investigador
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/publicaciones?investigadorCorreo=DEMOBRUNO@uptc.edu.co"
  params:
    - name: investigadorCorreo
      value: DEMOBRUNO@uptc.edu.co
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/publicaciones"
      method: GET
      params:
        - name: investigadorCorreo
          value: invest@uptc.edu.co
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
