server:
  port: 8080

spring:
  application:
    name: investigadores-service
  datasource:
    url: jdbc:postgresql://localhost:5432/rica
    username: rica
    password: rica
    
grpc:
  server:
    port: 9090

jpa:
    hibernate:
      ddl-auto: validate 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

flyway:
    enabled: true       
    locations: classpath:db/migration